# Build settings for the Cabinwright SmartTube package. Read by build.sh and tools/fetch-upstream.sh.

# The upstream release this package is built from, pinned: a new upstream version is a change
# here, reviewed like any other.
UPSTREAM_REPO="yuliskov/SmartTube"
UPSTREAM_TAG="32.68s"
UPSTREAM_APK="SmartTube_stable_32.68_armeabi-v7a.apk"
UPSTREAM_SHA256="2130b23b17ed5cfd324baec81750a2be22059212b6ee17449f21cae2cb3a60d9"
# Upstream's signing certificate. Upstream's old key may have leaked (see its README), so an APK
# signed by anything else is refused even if the hash above is ever changed by mistake.
UPSTREAM_CERT_SHA256="109735aa24fe85e2e1623ebb3b1ecc4bf4263f4c6374e4411d646bfa2eda482a"

# SHA-256 of this package's own signing certificate. build.sh refuses anything else. This key
# signs SmartTube only: don't reuse the Cabinwright release key for a binary built from a
# 25 MB upstream APK nobody here has reviewed line by line.
SIGNING_CERT_SHA256=""
